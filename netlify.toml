# Netlify build + routing.
#
# Two rules matter:
#   1. /api/execute_node  -> the one function the front end talks to.
#   2. everything else    -> index.html, because this is a single-page app.
# Order counts: Netlify applies the first matching redirect, so /api/* sits first.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
